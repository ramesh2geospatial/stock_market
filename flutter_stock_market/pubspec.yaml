name: flutter_stock_market
description: "Cross-platform mobile app for Indian stock market research, 10-signal predictions, DuPont ROE, and concall intelligence."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  http: ^1.2.0
  html: ^0.15.4
  sqflite: ^2.3.0
  path: ^1.8.3
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
